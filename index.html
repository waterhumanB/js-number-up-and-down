<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UP DOWN GAME</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <h1 id="title">숫자 업&다운 Game</h1>
  <main>
    <article id="gameConfig">
      <h2>게임 설정</h2>
      <h3>숫자 범위</h3>
      <div>
        <input id="min" placeholder="최소"> - <input id="max" placeholder="최대">
      </div>
      <h3>
        진행 가능 횟수
      </h3>
      <input id="attempt">
      <button id="start">시작 하기</button>
    </article>
    <article id="playGame">
      <div>
        <label for="guess">숫자 입력</label>
        <input name="guess" id="guess">
        <button id="play">확인</button>
      </div>
      <h3>진행화면</h3>
      <div id="display"></div>
      <button id="reset">메인 화면으로 이동</button>
    </article>
  </main>
  <script type="module" src="./src/controller.js"></script>
</body>
</html>
